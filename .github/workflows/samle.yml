name: samle

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: samle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  samle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Hent avviksmeldinger
        env:
          ET_CLIENT_NAME: parole-togunnskyldninger
        run: python samle.py

      - name: Commit hvis noe nytt
        run: |
          set -euo pipefail
          git config user.name  "togunnskyldninger"
          git config user.email "actions@users.noreply.github.com"

          # git diff ser IKKE utsporede filer. Nye maanedsfiler og
          # sammendrag.json er nettopp det. Derfor: add foerst, sjekk etterpaa.
          git add -A

          if git diff --cached --quiet; then
            echo "Ingenting nytt. Ingen commit."
            exit 0
          fi

          antall=$(git diff --cached --numstat -- data | awk '{s+=$1} END {print s+0}')
          git commit -m "${antall} nye meldinger"

          for forsok in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
               && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushet paa forsoek ${forsok}."
              exit 0
            fi
            echo "Push feilet (forsoek ${forsok}), proever igjen..."
            sleep 5
          done
          echo "Klarte ikke aa pushe etter 3 forsoek." >&2
          exit 1
