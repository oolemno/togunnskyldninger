name: samle

on:
  schedule:
    # Fyrer ofte, men GitHub kjører schedule etter kapasitet og dropper det
    # meste — målt til 6–15 kjøringer i døgnet, ikke 144. Derfor looper hver
    # kjøring internt i fem timer i stedet for å hente én gang. Cronen er nå
    # bare en tenner: den starter en ny kjede når den forrige er ferdig.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# Aldri to samtidig. En fyring mens en kjøring pågår havner i kø og starter
# rett etterpå — det er slik dekningen blir sammenhengende.
concurrency:
  group: samle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  samle:
    runs-on: ubuntu-latest
    # GitHub tillater 6 timer per jobb. Vi looper i 5 og lar resten være margin.
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Samle i fem timer
        env:
          ET_CLIENT_NAME: parole-togunnskyldninger
          RUNDER: "60"
          PAUSE: "300"
        run: |
          # Bevisst uten -e: en feilet runde skal ikke drepe fem timers innsamling.
          set -uo pipefail

          git config user.name  "togunnskyldninger"
          git config user.email "actions@users.noreply.github.com"

          lagre() {
            git add -A
            if ! git diff --cached --quiet; then
              antall=$(git diff --cached --numstat -- data | awk '{s+=$1} END {print s+0}')
              git commit -q -m "${antall} nye meldinger"
            fi

            # Push også commits fra en tidligere runde der pushen feilet,
            # ellers ville de forsvunnet med runneren. Bruker eksplisitt
            # origin-ref, ikke @{u}: mangler upstream-sporing gir @{u} en feil,
            # og da ville vi stilltiende sluttet å pushe. Ved tvil: push.
            ubetalt=$(git rev-list --count "origin/${GITHUB_REF_NAME}..HEAD" 2>/dev/null || echo 1)
            [ "${ubetalt}" -eq 0 ] && return 0

            for forsok in 1 2 3; do
              if git pull -q --rebase --autostash origin "${GITHUB_REF_NAME}" \
                 && git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
                return 0
              fi
              sleep 5
            done
            echo "::warning::push feilet, ${ubetalt} commit(s) venter til neste runde"
          }

          for runde in $(seq 1 "${RUNDER}"); do
            echo "--- runde ${runde}/${RUNDER}  $(date -u +%H:%M:%S)Z ---"
            python samle.py || echo "::warning::henting feilet i runde ${runde}"
            lagre
            [ "${runde}" -lt "${RUNDER}" ] && sleep "${PAUSE}"
          done
          echo "Ferdig etter ${RUNDER} runder."
